<!doctype html>
<html lang="en">

<title>Atlas Shell Lab</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="gem" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h16l6 8-14 17L2 12z" fill="#00ED64"/><path d="M2 12h28M8 4l8 25M24 4l-8 25M11 12l5-8 5 8" stroke="#001E2B" stroke-width="1.4" fill="none"/></svg>
      <div><b>Luscious Jewels · Atlas Shell Lab</b><span>Chapter 02 · CRUD Operations in mongosh</span></div>
    </div>
    <nav class="chapters" aria-label="Chapters"><a class="on" href="index.html">Ch 02 · CRUD</a><a href="chapter03.html">Ch 03 · Operators</a></nav>
    <nav class="dots" id="dots" aria-label="Questions"></nav>
    <button class="fsbtn" id="fs" type="button">⛶ Full screen</button>
  </header>

  <main>
    <section class="q" id="q" aria-live="polite"></section>
    <section class="right">
      <div class="shell" id="shell">
        <div class="shbar"><span class="live"></span><span class="t">MONGOSH</span><span class="conn">mongodb+srv://lusciousjewels.lj7k2q.mongodb.net · Cluster0</span><button id="clr" type="button">Clear</button></div>
        <div class="out" id="out"></div>
        <div class="inrow"><span class="pr" id="prompt"></span><textarea id="cmd" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="mongosh input"></textarea></div>
      </div>
      <div class="data" id="data">
        <div class="dhead"><b>Data</b><span class="crumbs" id="dcrumb"></span><span class="chips" id="dchips"></span><span class="sp"></span><button class="mini" id="dtog" type="button">Hide</button></div>
        <div class="dbody" id="dbody"></div>
      </div>
    </section>
  </main>

  <footer class="bot">
    <button class="nav" id="prev" type="button">← Back</button>
    <span class="crumb" id="crumb"></span>
    <span class="credit"><b>Innovation in Education</b><i>—</i>Satyaki Das</span>
    <button class="nav" id="next" type="button">Next →</button>
    <span class="hint">Enter runs · Shift+Enter new line · ↑↓ history</span>
  </footer>
</div>

<script src="engine.js"></script>
<script src="ch02.js"></script>
